[project]
name = "agents-chronicle-enterprise"
version = "0.0.0"
description = "Chronicle Enterprise: single sign-on, policies, audit export and admin reports for Chronicle's team hub."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Chronicle-Enterprise"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Tam" }]
dependencies = ["interlatch"]

[project.urls]
Repository = "https://github.com/Chatixia-AI/agents-chronicle/tree/main/ee"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle_ee"]
