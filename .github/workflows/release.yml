name: Release

# Releasing is one button: Actions → Release → Run workflow on main, and pick patch, minor or major. The version
# lives in the git tags (hatch-vcs), so nothing is committed first. The run works out the next version from the
# latest vX.Y.Z tag, runs the tests, creates the tag and the GitHub release (the changelog's "## Unreleased"
# section is its notes), publishes agents-chronicle to PyPI (trusted publishing, no token), publishes the hub's image
# ghcr.io/chatixia-ai/chronicle-hub (docker/, built from that PyPI release), attaches Chronicle-X.Y.Z-arm64.dmg, and
# opens a pull request that dates the changelog section.
# "dry run" (the default) runs the tests and keeps the DMG as a workflow artifact, publishing nothing.
# Publishing a release tagged vX.Y.Z on GitHub by hand runs the same tests, PyPI and DMG jobs.
#
# The DMG is signed and notarized when these repository secrets exist, otherwise it is ad-hoc signed:
#   MACOS_CERT_P12            base64 of the "Developer ID Application" certificate + key (.p12)
#   MACOS_CERT_PASSWORD       its export password
#   MACOS_CODESIGN_IDENTITY   e.g. "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool (app-specific password)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up (dry run publishes nothing)
        type: choice
        options: [dry run, patch, minor, major]
        default: dry run

permissions: {}  # each job asks for what it needs

concurrency:
  group: release  # one release at a time, so two runs never pick the same version
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}  # empty on a dry run
      create: ${{ steps.plan.outputs.create }}    # "true" when this run creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # every tag, to find the latest
          persist-credentials: false
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = release ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag $RELEASE_TAG is not vX.Y.Z"
              exit 1
            fi
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [ "$BUMP" != "dry run" ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Releases come from main; this run is on $GITHUB_REF"
              exit 1
            fi
            VERSION=$(python3 packaging/release.py next "$BUMP")
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "create=true" >> "$GITHUB_OUTPUT"
            echo "Releasing Chronicle **$VERSION** ($BUMP)" >> "$GITHUB_STEP_SUMMARY"
          fi

  test:
    needs: plan
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the version comes from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false  # a release never restores a cache another run could have written
      - run: uv run --locked pytest -q

  release:
    needs: [plan, test]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python3 packaging/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Chronicle $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  pypi:
    needs: [plan, test, release]
    # on a published release the release job is skipped: the tag is already there
    if: >-
      !cancelled() && needs.plan.outputs.version != '' && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # checkout
      id-token: write  # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          fetch-depth: 0  # the version comes from the tag
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false  # a release never restores a cache another run could have written
      - run: uv build
      - name: Check the build carries the release's version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          ls dist
          if [ ! -f "dist/agents_chronicle-$VERSION-py3-none-any.whl" ]; then
            echo "::error::The build is not version $VERSION"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  image:
    needs: [plan, pypi]
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read   # checkout
      packages: write  # push to ghcr.io
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      IMAGE: ghcr.io/chatixia-ai/chronicle-hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: v${{ needs.plan.outputs.version }}
          persist-credentials: false
      - name: Wait until PyPI serves the release
        run: |
          for _ in $(seq 1 30); do
            if python3 -m pip download --quiet --no-deps --no-cache-dir --dest "$RUNNER_TEMP/probe" \
                "agents-chronicle==$VERSION"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI does not serve agents-chronicle $VERSION after 5 minutes"
          exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          build-args: CHRONICLE_VERSION=${{ needs.plan.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.plan.outputs.version }}
            ${{ env.IMAGE }}:latest
          push: true

  macos-app:
    needs: [plan, test, release]
    if: >-
      !cancelled() && needs.test.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.release.result)
    runs-on: macos-14  # Apple silicon; PyInstaller cannot cross-build, so an Intel build needs an Intel runner
    permissions:
      contents: write  # upload the DMG to the release
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      VERSION: ${{ needs.plan.outputs.version }}  # empty on a dry run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.version != '' && format('v{0}', needs.plan.outputs.version) || github.sha }}
          fetch-depth: 0  # the version comes from the tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: false  # a release never restores a cache another run could have written

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build Chronicle.app and DMG
        env:
          CHRONICLE_CODESIGN_IDENTITY: ${{ env.HAS_CERT == 'true' && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/macos/build.sh

      - name: Attach DMG to the release
        if: env.VERSION != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" dist/Chronicle-*.dmg --repo "$GITHUB_REPOSITORY" --clobber

      - name: Keep DMG as a workflow artifact
        if: env.VERSION == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: Chronicle-dmg
          path: dist/Chronicle-*.dmg

  changelog:
    needs: [plan, pypi]
    if: needs.plan.outputs.create == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the branch
      pull-requests: write  # open the pull request
      actions: write        # start CI on the branch: a push made with this token starts no workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Open a pull request that dates the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          BRANCH="changelog-$VERSION"
          python3 packaging/release.py date "$VERSION" "$(date -u +%F)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$(git rev-parse HEAD)" > /dev/null
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" -f branch="$BRANCH" \
            -f message="Changelog: $VERSION" -f content="$(base64 -w0 CHANGELOG.md)" \
            -f sha="$(git rev-parse HEAD:CHANGELOG.md)" > /dev/null
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"  # the required test check
          if URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Changelog: $VERSION" \
              --body "Dates the changelog's Unreleased section for the $VERSION release."); then
            echo "Changelog pull request: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            # fail the run: the next release stops at its plan step until this pull request is merged, and a line in
            # the summary alone goes unnoticed. Settings › Actions › General › "Allow GitHub Actions to create and
            # approve pull requests" lets this step open it.
            OPEN="https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            echo "Open the changelog pull request, then merge it before the next release: $OPEN" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$VERSION is released, but its changelog pull request could not be opened. Open it and merge it before the next release: $OPEN"
            exit 1
          fi
