name: Changelog

# A pull request that changes what ships (src/, ee/src/, docker/, vscode-extension/) adds a file to changelog.d/
# saying what users will notice: the Release workflow publishes the files added since the last tag as the release
# notes and refuses to run when there are none. A line under "## Unreleased" in CHANGELOG.md (the old way) fails the
# check. The no-changelog label skips it for a change users won't notice.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the merge commit, the base branch it merges into, and the tags (which entries are released)
      - run: python3 packaging/release.py entry HEAD^1
