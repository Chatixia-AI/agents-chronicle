name: Docs

# Builds the documentation site from docs/ and the READMEs (mkdocs.yml) and publishes it to GitHub Pages.
# Pull requests only build it, so broken links and anchors fail before they reach main.

on:
  push:
    branches: [main]
    paths: [docs/**, README.md, README.ja.md, mkdocs.yml, packaging/macos/icon.png, pyproject.toml, uv.lock, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, README.md, README.ja.md, mkdocs.yml, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: uv run --locked --only-group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
