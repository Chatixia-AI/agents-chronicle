[project]
name = "agents-chronicle"
version = "0.5.1"
dynamic = ["readme"]
description = "Record, archive, analyze and explore every coding-agent session (Claude Code, Codex, Copilot, Bob): a local knowledge vault built with Claude Code itself."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Tam" }]
keywords = ["claude-code", "codex", "github-copilot", "coding-agents", "mcp", "knowledge-base", "transcripts", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = ["rich>=13.7"]

[project.urls]
Documentation = "https://chronicle.chatixia.net/"
Repository = "https://github.com/Chatixia-AI/agents-chronicle"
Issues = "https://github.com/Chatixia-AI/agents-chronicle/issues"

[project.scripts]
chronicle = "chronicle.cli:main"

[project.optional-dependencies]
app = [
    "pyobjc-framework-servicemanagement>=11 ; sys_platform == 'darwin'",
    "pywebview>=6.2,<7 ; sys_platform == 'darwin'",  # desktop.py extends its Cocoa app delegate
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

# PyPI shows the README without the repository around it: make its relative images and links absolute.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src="|\]\()(?!https?://|#)([^")]+\.(?:png|svg|jpg|gif))'
replacement = '\1https://raw.githubusercontent.com/Chatixia-AI/agents-chronicle/main/\2'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(href="|\]\()(?!https?://|#)([^")]+)'
replacement = '\1https://github.com/Chatixia-AI/agents-chronicle/blob/main/\2'

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[dependency-groups]
build = [
    "pillow>=11",
    "pyinstaller>=6.11",
]
dev = ["pytest>=8"]
docs = [
    "mkdocs-material>=9.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
