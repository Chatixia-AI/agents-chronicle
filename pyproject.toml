[project]
name = "agents-chronicle"
version = "0.1.1"
description = "Record, archive, analyze and explore every coding-agent session (Claude Code, Codex, Copilot, Bob): a local knowledge vault built with Claude Code itself."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13.7"]

[project.urls]
Repository = "https://github.com/kayeungadrian-tam/agents-chronicle"
Issues = "https://github.com/kayeungadrian-tam/agents-chronicle/issues"

[project.scripts]
chronicle = "chronicle.cli:main"

[project.optional-dependencies]
app = [
    "pyobjc-framework-servicemanagement>=11 ; sys_platform == 'darwin'",
    "pywebview>=6.2,<7 ; sys_platform == 'darwin'",  # desktop.py extends its Cocoa app delegate
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronicle"]

[dependency-groups]
build = [
    "pillow>=11",
    "pyinstaller>=6.11",
]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
