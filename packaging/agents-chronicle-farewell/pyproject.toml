# agents-chronicle, Interlatch's name on PyPI before it was renamed from Chronicle. It installs interlatch and keeps the
# commands, so a copy installed under the old name moves to Interlatch with its usual upgrade: `uv tool upgrade
# agents-chronicle`, or the dashboard's Update button, which runs it.
#
# The release workflow publishes it with every release, writing that release's version over the placeholder version
# in each line below (.github/workflows/release.yml). Pinned to it, this name follows interlatch's releases exactly,
# and a copy from before the rename, which asks PyPI about agents-chronicle, sees each one as an update.
[project]
name = "agents-chronicle"
version = "0.0.0"
description = "Chronicle is now Interlatch: this installs interlatch (https://pypi.org/project/interlatch/)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Adrian Tam" }]
dependencies = ["interlatch==0.0.0"]

[project.optional-dependencies]  # the extras agents-chronicle had, so an install that has one keeps it
app = ["interlatch[app]==0.0.0"]
team = ["interlatch[team]==0.0.0"]
postgres = ["interlatch[postgres]==0.0.0"]

# uv tool puts only the installed package's own commands on PATH, not its dependencies': interlatch's, again
[project.scripts]
interlatch = "chronicle.cli:main"
chronicle = "chronicle.cli:main"

[project.urls]
Homepage = "https://interlatch.com"
Repository = "https://github.com/Chatixia-AI/agents-chronicle"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # no code of its own: it comes with interlatch
